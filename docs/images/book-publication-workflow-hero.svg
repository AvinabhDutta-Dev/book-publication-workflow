<text x="95" y="205" fill="#FFF8EC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="-.8">FROM RAW CHAPTER</text>
<text x="95" y="278" fill="#FFF8EC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="-.8">TO <tspan fill="#60E1D1">EDITOR-REVIEWED</tspan></text>
<text x="95" y="351" fill="#FFF8EC" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="-.8">PAGES</text>
<text x="99" y="405" fill="#AFC2D5" font-family="Arial, Helvetica, sans-serif" font-size="24">Scrape a source chapter, rewrite and review with Gemini,</text>
<text x="99" y="439" fill="#AFC2D5" font-family="Arial, Helvetica, sans-serif" font-size="24">then add a human feedback step and store versions.</text>

