name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The tests need no secrets, so the workflow only gets read access.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the oldest version the project supports; 3.13 is a recent one.
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # No API key or browser download is needed: the tests replace Gemini
      # and the browser with stand-ins.
      - name: Run tests
        run: python -m unittest discover -s tests -v
