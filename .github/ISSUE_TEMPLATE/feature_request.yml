name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. For a larger change, describing the problem first makes it
        easier to agree on an approach before any code is written.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the behavior or feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other approaches or workarounds, if any.
  - type: dropdown
    id: area
    attributes:
      label: Which part of the pipeline does this touch?
      options:
        - Scraping
        - AI writer or reviewer
        - Human feedback step
        - Storage and search (ChromaDB)
        - Documentation or setup
        - Other
    validations:
      required: true
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on this yourself?
      options:
        - "Yes"
        - "Maybe, with some guidance"
        - "No"
