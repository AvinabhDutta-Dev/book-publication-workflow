name: Bug report
description: Something does not work as the README says it should
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check the
        [troubleshooting table](https://github.com/AvinabhDutta-Dev/book-publication-workflow#troubleshooting)
        in the README first. Most setup problems (missing API key, retired Gemini model,
        Chromium not installed) are covered there.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: python main.py --url "https://en.wikisource.org/wiki/..."
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: The output of `python --version`.
      placeholder: Python 3.12.4
    validations:
      required: true
  - type: input
    id: gemini-model
    attributes:
      label: Gemini model
      description: The value of GEMINI_MODEL in your .env. Leave blank if you did not set one.
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the full error message or traceback.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find this problem.
          required: true
        - label: I removed API keys and other secrets from everything I pasted.
          required: true
